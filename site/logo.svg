<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 332" width="760" height="332" role="img" aria-labelledby="title desc">
  <title id="title">Ktemata</title>
  <desc id="desc">Engraved plaque: the Ktemata handheld with an open-book screen, the wordmark KTEMATA and the phrase κτῆμα ἐς ἀεί.</desc>

  <!-- plaque -->
  <rect x="6" y="6" width="748" height="320" rx="30" fill="#151b21" stroke="#2f3a45" stroke-width="2"/>
  <rect x="18" y="18" width="724" height="296" rx="22" fill="none" stroke="#8a6234" stroke-opacity="0.45" stroke-width="1.5"/>

  <!-- device front -->
  <rect x="325" y="44" width="110" height="152" rx="16" fill="#1f2830" stroke="#48545f" stroke-width="2.5"/>
  <rect x="333" y="52" width="94" height="136" rx="11" fill="#10161b"/>

  <!-- screen -->
  <rect x="339" y="59" width="82" height="60" rx="4" fill="#0a0e12" stroke="#39454f" stroke-width="1.5"/>
  <path d="M354 76 C 364 72, 373 72, 380 77 C 387 72, 396 72, 406 76 L406 101 C 396 97, 387 97, 380 102 C 373 97, 364 97, 354 101 Z"
        fill="none" stroke="#c98a45" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M380 77 V102" stroke="#c98a45" stroke-width="2.4"/>
  <path d="M360 83 H374 M386 83 H400 M360 89 H374 M386 89 H400" stroke="#8f744f" stroke-width="1.6" opacity="0.9"/>

  <!-- keyboard -->
  <g fill="#39444e">
    <rect x="340" y="126" width="11" height="8" rx="1.5"/><rect x="354" y="126" width="11" height="8" rx="1.5"/>
    <rect x="368" y="126" width="11" height="8" rx="1.5"/><rect x="382" y="126" width="11" height="8" rx="1.5"/>
    <rect x="396" y="126" width="11" height="8" rx="1.5"/><rect x="410" y="126" width="11" height="8" rx="1.5"/>
    <rect x="340" y="137" width="11" height="8" rx="1.5"/><rect x="354" y="137" width="11" height="8" rx="1.5"/>
    <rect x="368" y="137" width="11" height="8" rx="1.5"/><rect x="382" y="137" width="11" height="8" rx="1.5"/>
    <rect x="396" y="137" width="11" height="8" rx="1.5"/><rect x="410" y="137" width="11" height="8" rx="1.5"/>
    <rect x="340" y="148" width="11" height="8" rx="1.5"/><rect x="354" y="148" width="11" height="8" rx="1.5"/>
    <rect x="368" y="148" width="11" height="8" rx="1.5"/><rect x="382" y="148" width="11" height="8" rx="1.5"/>
    <rect x="396" y="148" width="11" height="8" rx="1.5"/>
    <rect x="340" y="159" width="81" height="8" rx="1.5"/>
  </g>
  <rect x="410" y="148" width="11" height="8" rx="1.5" fill="#a86f34"/>

  <!-- wordmark -->
  <text x="380" y="252" text-anchor="middle"
        font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif"
        font-size="66" font-weight="700" letter-spacing="9" fill="#f2ebe0">KTEMATA</text>
  <text x="380" y="290" text-anchor="middle"
        font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif"
        font-size="25" font-style="italic" fill="#c99a63">κτῆμα ἐς ἀεί</text>
</svg>
