<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
  <title id="title">r5 lid cover — recessed Waveshare display section</title>
  <desc id="desc">Current and proposed cross-sections. The proposed broad cover front is coplanar with the display glass. The display recess is 10.50 mm deep, the rear mounting skin is 4.00 mm, and the overall thickness remains 14.50 mm.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="currentColor"/>
    </marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="var(--muted)" stroke-width="1"/>
    </pattern>
  </defs>

  <g font-family="sans-serif" font-size="14" fill="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <text x="24" y="30" font-size="20" font-weight="bold">KTEMATA r5 — LID COVER / DISPLAY SECTION</text>
    <text x="24" y="52" fill="var(--muted)">Schematic, not to scale · all dimensions in mm · viewed towards the hinge-side section</text>

    <!-- Current design -->
    <text x="50" y="92" font-size="17" font-weight="bold">CURRENT — DISPLAY ON BACKING PLATE</text>
    <text x="50" y="114" fill="var(--muted)">Only the narrow rim reaches the glass plane</text>

    <!-- Rear plate: 4.00 mm -->
    <rect x="50" y="330" width="350" height="48" fill="url(#hatch)" stroke="currentColor" stroke-width="1.5"/>
    <!-- Raised rim -->
    <rect x="155" y="204" width="18" height="126" fill="url(#hatch)" stroke="currentColor" stroke-width="1.5"/>
    <rect x="327" y="204" width="18" height="126" fill="url(#hatch)" stroke="currentColor" stroke-width="1.5"/>
    <!-- Display: 10.50 mm -->
    <rect x="173" y="204" width="154" height="126" fill="var(--accent)" fill-opacity="0.22" stroke="var(--accent)" stroke-width="1.5"/>
    <line x1="173" y1="204" x2="327" y2="204" stroke="var(--accent)" stroke-width="4"/>
    <text x="250" y="244" text-anchor="middle" fill="var(--accent)">WAVESHARE</text>
    <text x="250" y="264" text-anchor="middle" fill="var(--accent)">DISPLAY</text>
    <text x="250" y="194" text-anchor="middle" fill="var(--accent)">GLASS</text>
    <text x="250" y="319" text-anchor="middle">PCB BACK / SEAT</text>
    <text x="68" y="347">4.00 rear plate</text>
    <text x="68" y="365" fill="var(--muted)">broad front at z = 4.00</text>
    <text x="351" y="224" text-anchor="end">rim</text>

    <!-- Current protrusion dimension -->
    <line x1="173" y1="194" x2="428" y2="194" stroke="var(--muted)" stroke-dasharray="4 4"/>
    <line x1="400" y1="330" x2="428" y2="330" stroke="var(--muted)" stroke-dasharray="4 4"/>
    <line x1="420" y1="204" x2="420" y2="330" stroke="currentColor" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="434" y="250">10.50</text>
    <text x="434" y="269" fill="var(--muted)">display above</text>
    <text x="434" y="287" fill="var(--muted)">broad front</text>

    <!-- Proposed design -->
    <text x="510" y="92" font-size="17" font-weight="bold">PROPOSED — TRUE RECESSED, FLUSH FRONT</text>
    <text x="510" y="114" fill="var(--muted)">Full front panel; display drops into a 10.50 mm recess</text>

    <!-- Full-height printed front / sides -->
    <path d="M 510 204 H 653 V 330 H 827 V 204 H 920 V 378 H 510 Z"
          fill="url(#hatch)" stroke="currentColor" stroke-width="1.5"/>
    <!-- Display in recess -->
    <rect x="653" y="204" width="174" height="126" fill="var(--accent)" fill-opacity="0.22" stroke="var(--accent)" stroke-width="1.5"/>
    <line x1="510" y1="204" x2="653" y2="204" stroke="var(--success)" stroke-width="4"/>
    <line x1="653" y1="204" x2="827" y2="204" stroke="var(--accent)" stroke-width="4"/>
    <line x1="827" y1="204" x2="920" y2="204" stroke="var(--success)" stroke-width="4"/>
    <text x="740" y="244" text-anchor="middle" fill="var(--accent)">WAVESHARE</text>
    <text x="740" y="264" text-anchor="middle" fill="var(--accent)">DISPLAY</text>
    <text x="740" y="194" text-anchor="middle" fill="var(--success)">GLASS + PANEL FRONT — ONE PLANE</text>
    <text x="740" y="319" text-anchor="middle">PCB BACK / SEAT</text>
    <text x="740" y="350" text-anchor="middle">4.00 rear mounting skin</text>
    <text x="740" y="368" text-anchor="middle" fill="var(--muted)">4 × M3 through rear skin</text>

    <!-- Proposed recess and overall dimensions -->
    <line x1="630" y1="204" x2="630" y2="330" stroke="currentColor" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="616" y="254" text-anchor="end">10.50</text>
    <text x="616" y="273" text-anchor="end" fill="var(--muted)">recess</text>
    <line x1="938" y1="204" x2="938" y2="378" stroke="currentColor" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="950" y="280" transform="rotate(90 950 280)" text-anchor="middle">14.50 overall</text>

    <!-- Fixed host interface -->
    <line x1="36" y1="394" x2="934" y2="394" stroke="var(--muted)" stroke-width="2" stroke-dasharray="8 5"/>
    <text x="48" y="417" fill="var(--muted)">HOST LID / VHB TAPE PLANE — UNCHANGED</text>
    <line x1="400" y1="378" x2="400" y2="394" stroke="var(--muted)"/>
    <line x1="920" y1="378" x2="920" y2="394" stroke="var(--muted)"/>

    <!-- Datums and plan dimensions -->
    <text x="36" y="443" font-size="13">Model datums: rear / tape z = 0.00 · PCB seat z = 4.00 · glass + broad front z = 14.50</text>
    <text x="36" y="466" font-size="13">Opening: 193.96 × 111.76 (192.96 × 110.76 module + 0.50 clearance per side)</text>
    <text x="36" y="488" font-size="13">Cover: 233.50 × 178.10 · existing M3 positions, stand-off reliefs, cable notch and finger slots retained</text>
  </g>
</svg>
