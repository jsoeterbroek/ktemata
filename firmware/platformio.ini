; Status-OLED firmware for the Pi Fluks r2 handheld.
;
; Board: DFRobot FireBeetle 2 ESP32-UE (N16R2), SKU DFR1140.
;        Module ESP32-WROOM-32UE-N16R2: ESP32-D0WDR2-V3, 16 MB flash,
;        2 MB QSPI PSRAM, external antenna, CH340 USB-serial bridge.
;
; The stock PlatformIO board "dfrobot_firebeetle2_esp32e" assumes 4 MB flash
; and no PSRAM, so we use a project-local board definition in boards/.
;
;   pio run                 # build
;   pio run -t upload       # flash over the USB-C port (CH340)
;   pio device monitor      # 115200 baud
;
[env:firebeetle2_esp32ue]
platform = espressif32
board = dfrobot_firebeetle2_esp32ue_n16r2
framework = arduino

monitor_speed = 115200
upload_speed = 460800

build_flags =
    -DCORE_DEBUG_LEVEL=1
    ; 1.3" 128x64 I2C modules are usually SH1106. Set to 0 for an SSD1306
    ; module (0.96" or a 1.3" SSD1306 variant).
    -DOLED_CONTROLLER_SH1106=1
    ; 0 = normal, 2 = rotated 180 degrees (module mounted upside down).
    -DOLED_ROTATION=0
    ; Keep the display on while the sealed button is not fitted. Change to
    ; 60000UL once the button is wired and can wake the OLED.
    -DSCREEN_OFF_MS=0UL

lib_deps =
    adafruit/Adafruit SSD1306@^2.5.17
    adafruit/Adafruit SH110X@^2.1.15
    adafruit/Adafruit GFX Library@^1.12.6
    boschsensortec/BME68x Sensor library@^1.3.40408
    adafruit/RTClib@^2.1.4
    bblanchon/ArduinoJson@^7.4.3

; Pins used by the firmware (see include/config.h):
;   I2C SDA GPIO21, SCL GPIO22
;   sealed push button GPIO4 to GND
;   1.3" 4-pin OLED 0x3C/0x3D, BME688 0x76/0x77, DS3231 0x68, UPS HAT (E) 0x2D
